<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banderas Batalla CSS</title>

<style>
	body{font-family:Segoe UI,Arial,Helvetica,sans-serif;margin:18px;background:#F6F6F6;color:#111}
	.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,2fr));gap:18px;align-items:start}
	.card{background:#FFFFFF;border-radius:8px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
	.card h3{font-size:14px;margin:0 0 8px}
	.frame{border:0;width:480px;height:320px}
</style>

</head>

<body>

	<div class="grid">

		<div class="card">
			<h3>Bangladés</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Bangladés</title></head>
			<body>
				<div class="flagContainer">
					<div class="circle"></div>
				</div>
				<style>
					.flagContainer{width:400px; height:300px; background:#006A4D; border: solid 2px #000000; position:relative;}
					.circle{position:absolute; left:45%; top:50%; transform:translate(-50%,-50%); width:200px; height:200px; background:#F4263F; border-radius:50%;}
				</style>
			</body> </html>'> </iframe>
		</div>

		<div class="card">
			<h3>Irlanda</h3>
				<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Irlanda</title></head>
			<body>
				<div class="flagContainer"></div>
				<style>
					.flagContainer{width:400px; height:300px; background:linear-gradient(to right,#0E9C62 0% 33.3333%,#FFFFFF 33.3333% 66.6666%,#FF893C 66.6666% 100%);border: solid 2px #000000; }
				</style>
			</body> </html>'> </iframe>
		</div>

		<div class="card">
			<h3>Turquía</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Turquía</title></head>
			<body>
				<div class="flagContainer">
					<div class="crescentOuter"></div> <div class="crescentInner"></div> <div class="star"></div>
				</div>
				<style>
					.flagContainer{width:400px; height:300px; border: solid 2px #000000; background:#E4020F; position:relative;}
					.crescentOuter{position:absolute; left:50px; top:58px; width:175px; height:170px; border-radius:50%; background:#FFFFFF;}
					.crescentInner{position:absolute; left:90px; top:73px; width:140px; height:140px; border-radius:50%; background:#E4020F;}
					.crescentInner{border-radius:50%; background:#E4020F;}
					.star{position:absolute; left:205px; top:100px; width:80px; height:80px; background:#FFFFFF; transform:rotate(-18deg); transform-origin:center center; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
				</style>
			</body> </html>'> </iframe>
		</div>

		<div class="card">
			<h3>Etiopía</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Etiopía</title></head>
			<body>
				<div class="flagContainer">
					<div class="circle">
						<div class="star"> 
							<div class="pt1"></div> <div class="pt2"></div> <div class="pt3"></div> <div class="pt4"></div> <div class="pt5"></div>
						</div>
						<div class="flag-obj">
							<div class="pt1"></div> <div class="pt2"></div> <div class="pt3"></div> <div class="pt4"></div> <div class="pt5"></div>
						</div>
					</div>
				</div>
				<style>
					.flagContainer{width:400px; height:300px; background:linear-gradient(to bottom,#078930 0% 33.3333%,#FCDD09 33.3333% 66.6666%,#DA121A 66.6666% 100%); border: solid 2px #000000; position:relative;}
					.circle{position:absolute; left:50%; top:50%;transform:translate(-50%,-50%); width:200px; height:200px; background:#0F47AF; border-radius:50%; z-index:1;}
					.star {width: 70px; height: 70px; position: absolute; top: 15px; left: 88px;}
					.flag-obj {width: 3px; height: 35px; position: absolute; top: 150px; left: 95px;}
					.star div {width: 100%; height: 100%; position: absolute; background-color: #FCDD09; transform-origin: calc(131% / 9) calc(125% / 0.97); clip-path: polygon(14.777% 0, 40.083% 89.237%, 100% 89.237%, 87.072% 100%, 0 100%, 3.052% 89.237%, 30.207% 89.237%, 9.84% 17.414%);}
					.flag-obj div {width: 100%; height: 100%; position: absolute; background-color: #FCDD09; transform-origin: 50% calc(-200% / 1.4);}
					.pt2{transform: rotate(72deg);}
					.pt3{transform: rotate(144deg);}
					.pt4 {transform: rotate(216deg);}
					.pt5 {transform: rotate(288deg);}
				</style>
			</body> </html>'> </iframe>
		</div>

		<div class="card">
			<h3>Brasil</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Brasil</title></head>
			<body>
				<div class="flagContainer">
					<div class="triangleTop"></div>
					<div class="triangleBottom"></div>
					<div class="circle">
						<div class="whiteStripe"></div> <div class="bottomCircle"></div>
					</div>
				</div>
				<style>
					.flagContainer{width:400px; height: 300px; background: #009B39; border: solid 2px #000000; position: absolute;}
					.triangleTop{border: solid 150px transparent; border-bottom: solid 100px #FEE000; border-top-width: 0; position: absolute; top: 45px; left: 48px;}
					.triangleBottom{border: solid 150px transparent; border-top: solid 100px #FEE000; border-bottom-width: 0; position: absolute; top: 144px; left: 48px;}
					.circle{width: 120px; height: 120px; background: #002777; border-radius: 50%; position: absolute; top: 85px; left: 138px; overflow: hidden;}
					.whiteStripe{width: 275px; height: 275px; background: #FFF; border-radius: 50%; position: absolute; top: 32px; left: -112px;}
					.bottomCircle{width: 256px; height: 256px; background: #002777; border-radius: 50%; position: absolute; top: 40px; left: -104px;}
				</style>
			</body> </html>'> </iframe>
		</div>

		<div class="card">
			<h3>Corea del Sur</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Corea del Sur</title></head>
			<body>
				<div class="flagContainer">
					<div class="yinYang"></div>
					<div class="trigramContainer" id="trigram1">
						<div class="fullstr"></div> <div class="fullstr"></div> <div class="fullstr"></div>
					</div>
					<div class="trigramContainer" id="trigram2">
						<div class="halfstr"></div> <div class="fullstr"></div> <div class="halfstr"></div>
					</div>
					<div class="trigramContainer" id="trigram3">	
						<div class="fullstr"></div> <div class="halfstr"></div> <div class="fullstr"></div>
					</div>
					<div class="trigramContainer" id="trigram4">
						<div class="halfstr"></div> <div class="halfstr"></div> <div class="halfstr"></div>
					</div>
				</div>
				<style>
					.flagContainer{width: 400px; height: 300px; background: #FFFFFF; border: solid 2px #000000; position: relative; display: flex; justify-content: center; align-items: center;}
					.yinYang{width: 150px; height: 150px; border-radius: 50%; position: relative; background: linear-gradient(to bottom left, #CD2E3A 0%, #CD2E3A 50%, #0047A0 50%, #0047A0 100%); overflow: hidden;}
					.yinYang:before {content: ""; position: absolute; top: 10px; left: 5px; width: 80px; height: 80px; border-radius: 50%; background-color: #CD2E3A;}
					.yinYang:after {content: ""; position: absolute; top: 60px; right: 2px; width: 80px; height: 80px; border-radius: 50%; background-color: #0047A0; }
					.fullstr{background: #000000; width: 70px; height: 12px; margin-bottom: 5px;}
					.halfstr{background: #FFFFFF; width: 8px; height: 12px; border-left: solid 30px #000000; border-right: solid 30px #000000; margin-bottom: 5px;}
					.trigramContainer {position: absolute; display: flex; flex-direction: column; align-items: center;}
					#trigram1{ top: 45px; left: 45px; transform: rotate(-55deg); }
					#trigram2{ top: 45px; right: 45px; transform: rotate(55deg); }
					#trigram3{ bottom: 45px; left: 45px; transform: rotate(55deg); }
					#trigram4{ bottom: 45px; right: 45px; transform: rotate(-55deg); }
				</style>
			</body> </html> '> </iframe>
		</div>

		<div class="card">
			<h3>Venezuela</h3>
			<iframe class="frame" srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Venezuela</title></head>
			<body>
				<div class="flagContainer">
					<div class="starsContainer">
						<div class="star1"></div> <div class="star2"></div> <div class="star3"></div> <div class="star4"></div> <div class="star5"></div> <div class="star6"></div> <div class="star7"></div> <div class="star8"></div>
					</div>
				</div>
				<style>
					.flagContainer{width:400px; height:300px; background:linear-gradient(to bottom,#FFCC00 0% 33.3333%,#00247D 33.3333% 66.6666%,#CF142B 66.6666% 100%); border: solid 2px #000000; position:relative;}
					.starsContainer{position:absolute; left:50%; top:72%; transform:translate(-50%,0); width: 1px; height: 1px;}
					.star1, .star2, .star3, .star4, .star5, .star6, .star7, .star8 {width: 30px; height: 30px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); position: absolute; top:0 ; left:0; margin-left:-15px ; margin-top:-15px;} 
					.star1 { transform: rotate(-70deg) translateY(-100px); }
					.star2 { transform: rotate(-50deg) translateY(-100px); }
					.star3 { transform: rotate(-30deg) translateY(-100px); }
					.star4 { transform: rotate(-10deg) translateY(-100px); }
					.star5 { transform: rotate(10deg) translateY(-100px); }
					.star6 { transform: rotate(30deg) translateY(-100px); }
					.star7 { transform: rotate(50deg) translateY(-100px); }
					.star8 { transform: rotate(70deg) translateY(-100px) }
				</style>
			</body> </html>'> </iframe>
	</div>
</body>
</html>
