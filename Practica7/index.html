<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consuming The Harry Potter API</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="img/logo.png" alt="HP Logo">
    </div>
    <nav class="nav">
      <a href="#characters-grid" class="nav-link">Characters</a>
      <a href="https://hp-api.onrender.com/" class="nav-link btn-outline">API DOCS</a>
    </nav>
  </header>

  <section class="banner-section">
    <div class="carousel">
      <div class="carousel-inner" id="carousel-inner">
        <img src="img/banners/banner_1.png" alt="Banner 1" class="carousel-item active">
        <img src="img/banners/banner_2.png" alt="Banner 2" class="carousel-item">
        <img src="img/banners/banner_3.png" alt="Banner 3" class="carousel-item">
      </div>
      <div class="banner-text">
        <h1>Consuming The Harry Potter API</h1>
      </div>
    </div>
  </section>

  <main class="container">
    <div id="characters-grid" class="characters-grid"></div>
    <div class="load-more-container">
      <button id="load-more" class="btn-load-more">LOAD MORE..</button>
    </div>
  </main>

  <footer class="footer">
    <p>&lt;&gt; by <strong>Pereira José</strong> 2025</p>
  </footer>

  <script src="js/functions.js"></script>

</body>

</html>
